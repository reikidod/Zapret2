name: One-time C# source migration

on:
  push:
    branches: [main]
    paths:
      - "migration-parts/**"

permissions:
  contents: write

concurrency:
  group: zapret2-csharp-migration
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reassemble and extract C# source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "migration-parts" -Filter "*.b64" | Sort-Object Name
          if ($parts.Count -lt 2) { throw "Migration archive parts are missing." }
          $joined = ($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ""
          $bytes = [Convert]::FromBase64String($joined)
          $archive = Join-Path $PWD "Zapret2-CSharp-Portable-Source.tar.gz"
          [System.IO.File]::WriteAllBytes($archive, $bytes)

          $extract = Join-Path $env:RUNNER_TEMP "zapret2-csharp-import"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          tar -xzf $archive -C $extract

          if (!(Test-Path (Join-Path $extract "Zapret2.sln"))) {
            throw "Zapret2.sln is missing from the reconstructed archive."
          }
          if (!(Test-Path (Join-Path $extract "src/Zapret2.App/Zapret2.App.csproj"))) {
            throw "WPF application project is missing from the reconstructed archive."
          }

          Get-ChildItem -LiteralPath $extract -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $PWD -Recurse -Force
          }

          Remove-Item $archive -Force
          Remove-Item "migration-parts" -Recurse -Force
          if (Test-Path "Zapret2-CSharp-Portable-Source.tar.xz") {
            Remove-Item "Zapret2-CSharp-Portable-Source.tar.xz" -Force
          }
          if (Test-Path "zapret2-rust-source.zip") {
            New-Item -ItemType Directory -Path "legacy/rust" -Force | Out-Null
            Move-Item "zapret2-rust-source.zip" "legacy/rust/zapret2-rust-source.zip" -Force
          }
          # This workflow is only needed for the one-time import.
          Remove-Item ".github/workflows/import-csharp-source.yml" -Force

      - name: Commit conventional C# source tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw "The migration produced no tracked changes."
          }
          git commit -m "feat: migrate Zapret2 Control Center to C# WPF"
          git push

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Zapret2.sln

      - name: Run tests
        run: dotnet test Zapret2.sln --configuration Release --no-restore --logger "trx;LogFileName=zapret2-tests.trx"

      - name: Publish portable single-file EXE
        run: >-
          dotnet publish src/Zapret2.App/Zapret2.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/win-x64

      - name: Verify executable and prepare distribution files
        shell: pwsh
        run: |
          $exe = "publish/win-x64/Zapret2ControlCenter.exe"
          if (!(Test-Path $exe)) { throw "Portable executable was not produced: $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { throw "Executable is unexpectedly small ($size bytes)." }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Zapret2ControlCenter.exe" | Set-Content "publish/win-x64/SHA256SUMS.txt" -Encoding ASCII
          @'
          Zapret2 Control Center — Windows x64 portable build

          Run Zapret2ControlCenter.exe. No separately installed .NET Runtime is required.
          This is the GUI/controller only. It does not include winws2.exe, WinDivert,
          drivers, or a zapret2 bundle. Select your separately installed bundle in Settings.
          User configuration is stored in %APPDATA%\Zapret2GUI and is not inside this EXE.
          '@ | Set-Content "publish/win-x64/README.txt" -Encoding UTF8
          @("Portable EXE: $size bytes", "SHA-256: $hash") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapret2ControlCenter-Windows-x64
          path: publish/win-x64/*
          if-no-files-found: error
          retention-days: 30
