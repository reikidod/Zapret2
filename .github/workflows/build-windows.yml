name: Build Windows x64 portable EXE
# Rebuild trigger: validate the committed source archive and produce the portable artifact.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'zapret2-rust-source.zip'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Rust source
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath zapret2-rust-source.zip)) {
            Write-Error "zapret2-rust-source.zip not found in repo root. Commit it to main and re-run."
            exit 1
          }
          Expand-Archive -LiteralPath zapret2-rust-source.zip -DestinationPath _source -Force
          $root = if (Test-Path -LiteralPath _source/zapret2-rust) { '_source/zapret2-rust' } else { '_source' }
          Copy-Item "$root/*" . -Recurse -Force
          if (-not (Test-Path -LiteralPath Cargo.toml)) {
            Write-Error "Cargo.toml not found after extraction."
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Stage portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/zapret2-control-center.exe dist/Zapret2ControlCenter.exe
          @'
          Zapret2 Control Center — portable Windows x64
          The GUI is portable and requires no Rust/Python runtime.
          It uses winws2.exe, WinDivert, Lua and blockcheck2.cmd from your existing zapret-win-bundle.
          '@ | Set-Content dist/README.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Zapret2ControlCenter-Windows-x64
          path: dist/*
          if-no-files-found: error
