name: Build C# portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "native/**"
      - "tests/**"
      - "assets/**"
      - "scripts/**"
      - "Zapret2.sln"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "native/**"
      - "tests/**"
      - "assets/**"
      - "scripts/**"
      - "Zapret2.sln"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: zapret2-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' || github.event.release.tag_name != 'continuous'
    name: Restore, build, test and publish
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust native tests
        run: cargo test --manifest-path native/Cargo.toml

      - name: Build Rust native library (Windows x64)
        run: cargo build --manifest-path native/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Verify native library
        shell: pwsh
        run: |
          $native = "native/target/x86_64-pc-windows-msvc/release/zapret2_native.dll"
          if (!(Test-Path $native)) { throw "Rust native library was not produced: $native" }
          "Rust native library: $((Get-Item $native).Length) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare embedded runtime bundle
        shell: pwsh
        run: ./scripts/Prepare-Bundle.ps1

      - name: Restore
        run: dotnet restore Zapret2.sln

      - name: Build all projects
        run: dotnet build Zapret2.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Zapret2.sln --configuration Release --no-build --logger "trx;LogFileName=zapret2-tests.trx"

      - name: Publish portable single-file EXE
        run: >-
          dotnet publish src/Zapret2.App/Zapret2.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/win-x64

      - name: Verify executable and prepare distribution files
        shell: pwsh
        run: |
          $exe = "publish/win-x64/Zapret2ControlCenter.exe"
          if (!(Test-Path $exe)) { throw "Portable executable was not produced: $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { throw "Executable is unexpectedly small ($size bytes)." }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Zapret2ControlCenter.exe" | Set-Content "publish/win-x64/SHA256SUMS.txt" -Encoding ASCII
          @'
          Zapret2 Control Center — Windows x64 portable build

          Run Zapret2ControlCenter.exe. No separately installed .NET Runtime is required.
          Includes winws.exe, winws2.exe, both blockcheck scripts, WinDivert, Cygwin,
          Lua libraries, Flowseal profiles and baseline lists. No separate bundle download is required.
          User configuration is stored in %APPDATA%\Zapret2GUI and is not inside this EXE.
          '@ | Set-Content "publish/win-x64/README.txt" -Encoding UTF8
          @("Portable EXE: $size bytes", "SHA-256: $hash") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapret2ControlCenter-Windows-x64
          path: publish/win-x64/*
          if-no-files-found: error
          retention-days: 30

      - name: Move continuous tag to this successful build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.updateRef({
                owner, repo, ref: "tags/continuous", sha: context.sha, force: true
              });
            } catch (error) {
              if (error.status !== 404 && !(error.status === 422 && String(error.message).includes("Reference does not exist"))) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: "refs/tags/continuous", sha: context.sha
              });
            }

      - name: Publish or update permanent continuous download
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Zapret2 Control Center — Continuous
          body: |
            Automatically updated Windows x64 portable build from main.
            Updated only after restore, build, tests and publish succeed.
            Source commit: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            publish/win-x64/Zapret2ControlCenter.exe
            publish/win-x64/README.txt
            publish/win-x64/SHA256SUMS.txt

      - name: Attach portable EXE to a versioned GitHub Release
        if: github.event_name == 'release' && github.event.release.tag_name != 'continuous'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/win-x64/Zapret2ControlCenter.exe
            publish/win-x64/README.txt
            publish/win-x64/SHA256SUMS.txt
