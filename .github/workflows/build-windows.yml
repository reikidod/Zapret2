name: Build Windows x64 portable EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'zapret2-rust-source.zip'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: zapret2-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Rust source
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath zapret2-rust-source.zip)) {
            Write-Error "zapret2-rust-source.zip not found in repo root."
            exit 1
          }

          Expand-Archive -LiteralPath zapret2-rust-source.zip -DestinationPath _source -Force
          $root = if (Test-Path -LiteralPath _source/zapret2-rust/Cargo.toml) {
            '_source/zapret2-rust'
          } else {
            '_source'
          }

          if (-not (Test-Path -LiteralPath "$root/Cargo.toml")) {
            Write-Error "Cargo.toml not found in the source archive."
            exit 1
          }

          Get-ChildItem -LiteralPath $root -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination . -Recurse -Force
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Formatting enforcement is deferred until the Rust source is moved out
      # of the ZIP archive and can be formatted and reviewed as tracked files.
      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage portable app
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/zapret2-control-center.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Error "Release executable was not produced: $exe"
            exit 1
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination dist/Zapret2ControlCenter.exe

          @'
          Zapret2 Control Center — portable Windows x64

          This is the GUI application only. It requires a separately obtained
          zapret2 bundle containing winws2.exe, WinDivert, Lua files and
          blockcheck2.cmd. Review the project README before use.
          '@ | Set-Content dist/README.txt -Encoding UTF8

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapret2ControlCenter-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
